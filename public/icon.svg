<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="dubugaas-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="dubugaas-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#dubugaas-bg)"/>

  <!-- Subtle Inner Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6"/>

  <!-- Logo Content: Stylized Athletic Shoe & Box/Dozens Emblem -->
  <g filter="url(#glow)">
    <!-- Shoe Outline & Soles -->
    <path d="M 120 320 C 135 345, 175 355, 230 355 C 330 355, 385 340, 410 320 C 420 312, 425 295, 415 280 C 400 258, 380 248, 350 240 L 330 195 C 322 175, 305 160, 280 160 L 230 160 C 215 160, 205 170, 200 185 L 180 245 C 150 255, 125 275, 120 320 Z" 
          fill="#ffffff" />
    
    <!-- Shoe Sole Bottom Accent -->
    <path d="M 115 325 C 130 358, 175 370, 240 370 C 340 370, 395 355, 420 330 C 424 325, 420 315, 410 315 C 385 330, 335 342, 240 342 C 175 342, 130 330, 115 325 Z" 
          fill="url(#dubugaas-accent)" />

    <!-- Laces / Details -->
    <path d="M 235 185 L 295 185 M 225 210 L 310 210 M 215 235 L 325 235" 
          stroke="#4f46e5" stroke-width="8" stroke-linecap="round"/>

    <!-- DUBUGAAS "D" & Brand Lettering Symbol -->
    <circle cx="360" cy="150" r="42" fill="#10b981" />
    <path d="M 345 132 L 358 132 C 368 132, 376 140, 376 150 C 376 160, 368 168, 358 168 L 345 168 Z" fill="#ffffff"/>
  </g>

  <!-- Typography at Bottom -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6">DUBUGAAS</text>
  <text x="256" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#93c5fd" text-anchor="middle" letter-spacing="3">WHOLESALE &amp; POS</text>
</svg>
