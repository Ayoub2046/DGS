<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="hantiflow-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="hantiflow-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="hantiflow-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="hantiflow-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#hantiflow-bg)"/>

  <!-- Subtle Inner Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>

  <!-- Logo Graphics: Stylized 3D 'H' with Golden Upward Arrow & Financial Elements -->
  <g filter="url(#glow)">
    <!-- Left Pillar of 'H' (Blue) -->
    <rect x="100" y="120" width="56" height="230" rx="20" fill="url(#hantiflow-cyan)" />
    
    <!-- Right Pillar of 'H' (Green) -->
    <rect x="230" y="120" width="56" height="230" rx="20" fill="url(#hantiflow-green)" />
    
    <!-- Crossbar of 'H' -->
    <rect x="110" y="210" width="160" height="48" rx="16" fill="#ffffff" opacity="0.9" />

    <!-- Upward Golden Arrow wrapping across H -->
    <path d="M 80 270 Q 180 290 280 180 L 295 195 L 310 130 L 245 145 L 260 160 Q 170 250 80 230 Z" fill="url(#hantiflow-gold)"/>

    <!-- Mini Calculator & Invoice Icon on Right -->
    <rect x="330" y="180" width="100" height="140" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
    <rect x="345" y="195" width="70" height="30" rx="6" fill="#0284c7"/>
    <!-- Calc buttons -->
    <circle cx="355" cy="245" r="7" fill="#64748b"/>
    <circle cx="380" cy="245" r="7" fill="#64748b"/>
    <circle cx="405" cy="245" r="7" fill="#64748b"/>
    <circle cx="355" cy="270" r="7" fill="#64748b"/>
    <circle cx="380" cy="270" r="7" fill="#64748b"/>
    <circle cx="405" cy="270" r="7" fill="#f59e0b"/>
    <circle cx="355" cy="295" r="7" fill="#64748b"/>
    <circle cx="380" cy="295" r="7" fill="#64748b"/>
    <circle cx="405" cy="295" r="7" fill="#10b981"/>

    <!-- Gold Coins Stack -->
    <ellipse cx="430" cy="320" rx="30" ry="12" fill="url(#hantiflow-gold)"/>
    <ellipse cx="430" cy="310" rx="30" ry="12" fill="url(#hantiflow-gold)"/>
    <ellipse cx="430" cy="300" rx="30" ry="12" fill="#fbbf24"/>
  </g>

  <!-- Typography at Bottom -->
  <text x="256" y="425" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">HantiFlow</text>
  <text x="256" y="460" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#93c5fd" text-anchor="middle" letter-spacing="4">BUSINESS &amp; ACCOUNTING</text>
</svg>
